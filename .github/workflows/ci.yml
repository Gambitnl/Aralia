# Every required lane must pass before the same commit's Pages artifact is published.
name: 🔒 CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  policy:
    name: Repository Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/ci/repository-policy.mjs
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      # No API key enters this public build. spells:check precedes regeneration.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: ./dist
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
  validate:
    name: Data Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run spells:check
      # Separate from lint so both failures remain visible in the same run.
      - run: npm run validate
  test:
    name: Application Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install silhouette comparison dependency
        run: python -m pip install -r tools/creatureGate/requirements.txt
      - run: npm run test:types
      - run: npm run test:bounded
        env:
          VITEST_JSON_OUTPUT_FILE: ${{ runner.temp }}/vitest-results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: application-test-results
          path: ${{ runner.temp }}/vitest-results.json
          if-no-files-found: warn
  node-tests:
    name: Tooling Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - name: Install Chromium for private dashboard fixtures
        run: npx playwright install --with-deps chromium
      - name: Install pinned scanner for recovery fixtures
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          printf '[extend]\nuseDefault = true\n' > gitleaks-default.toml
          echo "TEST_GITLEAKS_PATH=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
          echo "TEST_GITLEAKS_CONFIG=$RUNNER_TEMP/gitleaks-default.toml" >> "$GITHUB_ENV"
      - run: npm run test:node
  quality-scan:
    name: Quality Scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm --silent run scan -- --json > quality-scan.json
      - uses: actions/upload-artifact@v7
        with:
          name: quality-scan-json
          path: quality-scan.json
  required:
    name: CI Required
    if: always()
    needs: [policy, typecheck, build, lint, validate, test, node-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Require every mandatory lane to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/require-checks.mjs
  deploy:
    name: Publish Checked Build
    needs: [required, build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
