# Preserve automatic repair intent through a checked API request and review PR.
name: 🔧 Auto-Fix CI Failures
on:
  workflow_run:
    workflows: ["🔒 CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed application PR CI run ID
        required: true
        type: string
      apply:
        description: Create a Jules repair session (otherwise inspect only)
        default: false
        type: boolean
concurrency:
  group: ci-repair-${{ github.event.workflow_run.head_sha || inputs.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  fix-failure:
    name: Request Reviewed Repair
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run uses trusted master code; failed PR code never executes with
      # the Jules credential. Forks, stale tips and repair loops are rejected.
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare or submit attributable repair
        run: node scripts/ci/request-repair.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          REPAIR_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          APPLY_REPAIR: ${{ github.event_name == 'workflow_run' || inputs.apply }}
