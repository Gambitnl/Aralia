# Scout simulates merges without changing either contributor's branch or index.
name: 🔍 Scout - Conflict Detection
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches: [master]
concurrency:
  group: scout
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  issues: write
jobs:
  detect-overlaps:
    name: Analyze PR Merges
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Inspect all PR tips and maintain coordination comments
        uses: actions/github-script@v9
        with:
          script: |
            const { runScout } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/scout.mjs`);
            const result = await runScout({ github, context });
            core.summary.addHeading('Scout merge inspection').addCodeBlock(JSON.stringify(result, null, 2), 'json');
            await core.summary.write();
