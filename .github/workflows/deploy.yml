# Called only after CI passes. This publishes the artifact from that same run;
# there is no standalone push/manual trigger that can bypass application checks.
name: Deploy to GitHub Pages
on:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject superseded master builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          test "$current" = "$GITHUB_SHA" || { echo 'A newer master commit exists; this build must not replace it.'; exit 1; }
      - name: Deploy checked artifact
        id: deployment
        uses: actions/deploy-pages@v5
