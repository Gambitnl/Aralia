<!doctype html>
<!--
  This standalone page is the human-facing map of Aralia's current codebase.

  It embeds the exact codemap.json snapshot so it opens directly from disk without a server
  or network connection. Native SVG keeps nineteen primary modules readable; lower-level
  files, source evidence, tests, callers, dependencies, and five end-to-end flows appear on
  demand in the detail panel instead of turning the first screen into a hairball.
-->

  <title>Aralia — Interactive Code Map</title>
  <style>
    /* ====================================================================== */
    /* Visual Foundation                                                      */
    /* ====================================================================== */
    /* A dark drafting-board palette keeps module colors useful without       */
    /* competing with the evidence text that carries the real review value.   */
    /* ====================================================================== */
    :root { --bg:#071018; --panel:#0d1824; --panel-2:#111f2d; --line:#294055; --text:#e7f2fb; --muted:#8fa8bb; --focus:#fef08a; --danger:#fda4af; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height:100vh; background:radial-gradient(circle at 12% 0%, #123047 0, transparent 34%), linear-gradient(145deg,#071018,#09131d 50%,#071018); }
    button, input { font:inherit; }
    button { color:inherit; }
    a { color:#7dd3fc; text-decoration:none; }
    a:hover { text-decoration:underline; }
    :focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    /* ====================================================================== */
    /* Header, Metrics, And Flow Controls                                     */
    /* ====================================================================== */
    .app { height:100vh; min-height:0; overflow:hidden; display:grid; grid-template-rows:auto auto 1fr; }
    .topbar { display:flex; gap:24px; align-items:flex-start; justify-content:space-between; padding:18px 22px 14px; border-bottom:1px solid #20384d; background:rgba(7,16,24,.88); backdrop-filter:blur(16px); position:sticky; top:0; z-index:20; }
    .brand h1 { margin:0; font-size:clamp(1.25rem,2vw,1.75rem); letter-spacing:-.025em; }
    .brand p { margin:5px 0 0; color:var(--muted); font-size:.9rem; }
    .header-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .search { width:min(310px,45vw); padding:10px 12px; border:1px solid #31516b; border-radius:10px; background:#081521; color:var(--text); }
    .ghost-button, .flow-button { border:1px solid #31516b; background:#10202d; border-radius:10px; padding:9px 11px; cursor:pointer; }
    .ghost-button:hover, .flow-button:hover { background:#173045; }
    .metrics { display:flex; gap:9px; padding:10px 22px; overflow:auto; border-bottom:1px solid #1b3042; background:rgba(9,20,30,.82); }
    .metric { white-space:nowrap; border:1px solid #29455b; border-radius:999px; padding:6px 10px; color:var(--muted); font-size:.78rem; }
    .metric strong { color:var(--text); margin-right:4px; }
    .flow-strip { display:flex; gap:8px; margin-left:auto; }
    .flow-button { white-space:nowrap; padding:6px 9px; font-size:.76rem; }
    .flow-button.active { border-color:var(--flow-color); box-shadow:0 0 0 1px var(--flow-color) inset; background:#17283a; }

    /* ====================================================================== */
    /* Main Map And Evidence Panel                                            */
    /* ====================================================================== */
    .workspace { min-height:0; overflow:hidden; display:grid; grid-template-columns:minmax(620px,1fr) minmax(340px,430px); gap:12px; padding:12px; }
    .map-panel, .details { min-height:0; border:1px solid #20384d; border-radius:16px; background:rgba(10,23,34,.92); box-shadow:0 18px 48px rgba(0,0,0,.28); overflow:hidden; }
    .map-panel { position:relative; }
    #map { width:100%; height:100%; min-height:0; display:block; }
    .map-help { position:absolute; left:16px; bottom:14px; padding:7px 9px; border-radius:8px; background:rgba(4,12,18,.86); border:1px solid #29455b; color:var(--muted); font-size:.72rem; pointer-events:none; }
    .details { overflow:auto; padding:18px; }
    .details h2 { margin:0 0 4px; font-size:1.3rem; }
    .details h3 { margin:20px 0 8px; font-size:.79rem; color:#b9cbd8; letter-spacing:.08em; text-transform:uppercase; }

    .eyebrow { color:var(--muted); font-size:.76rem; text-transform:uppercase; letter-spacing:.1em; }

    .relation-list strong { color:#e6f2fb; }
    .relation-list small { color:var(--muted); display:block; margin-top:2px; }
    .file-tools { display:flex; gap:8px; margin-bottom:8px; }
    .file-tools input { min-width:0; flex:1; border:1px solid #31516b; background:#081521; color:var(--text); border-radius:8px; padding:8px 9px; }

    .file-list li { padding:6px 8px; border-bottom:1px solid #1c3040; font:11px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; color:#b8cad6; overflow-wrap:anywhere; }
    .empty { color:var(--muted); font-style:italic; }
    .flow-steps { counter-reset:flow; }
    .flow-steps li { position:relative; padding:9px 0 9px 34px; border-bottom:1px solid #203445; line-height:1.45; }
    .flow-steps li::before { counter-increment:flow; content:counter(flow); position:absolute; left:0; top:9px; width:22px; height:22px; display:grid; place-items:center; border-radius:50%; background:var(--flow-color); color:#061018; font-weight:800; font-size:.72rem; }

    /* ====================================================================== */
    /* SVG Module And Relationship States                                     */
    /* ====================================================================== */
    .layer-label { fill:#698397; font-size:12px; text-transform:uppercase; letter-spacing:1.8px; }
    .layer-rule { stroke:#193044; stroke-width:1; stroke-dasharray:4 9; }
    .edge { fill:none; stroke:#35546a; stroke-width:1.35; opacity:.28; transition:opacity .16s, stroke .16s, stroke-width .16s; }
    .edge.secondary { opacity:.055; }
    .edge.data { stroke-dasharray:5 5; }
    .edge.dimmed { opacity:.05; }
    .edge.active { opacity:.95; stroke:var(--edge-color,#fef08a); stroke-width:3.2; }
    .module-node { cursor:pointer; transition:opacity .16s; }
    .module-node .card { fill:#0e1d29; stroke:#38556a; stroke-width:1.5; rx:13; }
    .module-node .accent { fill:var(--node-color); opacity:.95; }
    .module-node .node-title { fill:#edf7fd; font-size:13px; font-weight:750; pointer-events:none; }
    .module-node .node-meta { fill:#8fa8bb; font-size:10.5px; pointer-events:none; }
    .module-node:hover .card, .module-node.selected .card { stroke:var(--node-color); stroke-width:3; filter:drop-shadow(0 0 9px color-mix(in srgb,var(--node-color) 42%,transparent)); }
    .module-node.related .card { stroke:var(--node-color); stroke-width:2; }
    .module-node.dimmed { opacity:.16; }
    .module-node.search-hit .card { stroke:#fef08a; stroke-width:3; }

    @media (max-width:1000px) {
      .app { height:auto; min-height:100vh; overflow:visible; }
      .workspace { grid-template-columns:1fr; }
      .workspace { overflow:visible; }
      .map-panel { min-height:650px; }
      #map { min-height:650px; }
      .details { max-height:none; }
      .flow-strip { width:100%; overflow:auto; }
    }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; transition:none !important; } }
  </style>
</head>

  <script>
    /**
     * This embedded application turns the static codemap snapshot into an accessible explorer.
     *
     * It draws only the nineteen primary modules on the first screen. Selection and flow
     * controls reveal lower-level evidence without changing the underlying source snapshot.
     * No network requests or external libraries are used, so direct file opening remains safe.
     */
    (function startCodemap() {
      'use strict';

      // ====================================================================
      // Snapshot And View State
      // ====================================================================
      // The JSON script is the exact same object written to codemap.json. A few maps make
      // repeated selection and relationship lookups fast without mutating the snapshot.
      // ====================================================================
      const data = JSON.parse(document.getElementById('codemap-data').textContent);
      const moduleById = new Map(data.modules.map(function indexModule(module) { return [module.id, module]; }));
      const state = { selectedModuleId:null, selectedFlowId:null, search:'' };
      const svg = document.getElementById('map');
      const details = document.getElementById('details');
      const searchInput = document.getElementById('global-search');
      const nodeElements = new Map();
      const edgeElements = new Map();

      // Put the verified snapshot size in the header before drawing anything. This gives a
      // reviewer immediate proof that the nineteen cards are an abstraction, not the scan size.
      document.getElementById('metric-files').textContent = data.scope.totalFiles.toLocaleString();
      document.getElementById('metric-imports').textContent = data.scope.resolvedInternalImports.toLocaleString();
      document.getElementById('metric-modules').textContent = data.display.primaryNodeCount;
      document.getElementById('metric-flows').textContent = data.flows.length;
      document.getElementById('metric-excluded').textContent = data.scope.filteredByUnderstandIgnore;

      // ====================================================================
      // Native SVG Graph
      // ====================================================================
      // Fixed module positions keep the architecture stable between openings. Curved edges
      // show the selected call/data relationships; full file-import counts stay in details.
      // ====================================================================
      function renderGraph() {
        svg.setAttribute('viewBox', data.display.viewBox.join(' '));
        svg.innerHTML = '<title id="map-title">Aralia primary architecture modules</title>'
          + '<desc id="map-description">Nineteen clickable modules grouped across experience, runtime, foundations, world pipeline, and engineering.</desc>'
          + '<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53748a"></path></marker></defs>';

        const layerRows = [
          ['Experience', 42], ['Game Runtime', 238], ['Foundations / World Pipeline', 432], ['Engineering', 632],
        ];
        layerRows.forEach(function addLayerLabel(entry) {
          const label = svgElement('text', { x:18, y:entry[1], class:'layer-label' });
          label.textContent = entry[0];
          svg.appendChild(label);
          svg.appendChild(svgElement('line', { x1:18, y1:entry[1] + 8, x2:1282, y2:entry[1] + 8, class:'layer-rule' }));
        });

        data.relationships.forEach(function drawRelationship(edge) {
          const source = moduleById.get(edge.source);
          const target = moduleById.get(edge.target);
          const path = svgElement('path', {
            d:curveBetween(source, target),
            class:'edge ' + (isDataEdge(edge) ? 'data ' : '') + (isFlowTransition(edge) ? 'backbone' : 'secondary'),
            'data-edge-id':edge.id,
            'data-source':edge.source,
            'data-target':edge.target,
            'marker-end':'url(#arrow)',
          });
          const title = svgElement('title');
          title.textContent = source.name + ' → ' + target.name + ': ' + edge.label + (edge.importCount ? ' · ' + edge.importCount + ' current imports' : '');
          path.appendChild(title);
          svg.appendChild(path);
          edgeElements.set(edge.id, path);
        });

        data.modules.forEach(function drawModule(module) {
          const group = svgElement('g', {
            class:'module-node', transform:'translate(' + module.x + ' ' + module.y + ')', tabindex:'0', role:'button',
            'aria-label':module.name + '. ' + module.fileCount + ' owned files and ' + module.testFileCount + ' test files.',
            'data-module-id':module.id, style:'--node-color:' + module.color,
          });
          group.appendChild(svgElement('rect', { class:'card', width:200, height:82, rx:13 }));
          group.appendChild(svgElement('rect', { class:'accent', width:6, height:82, rx:3 }));
          appendWrappedTitle(group, module.name);
          const meta = svgElement('text', { x:16, y:67, class:'node-meta' });
          meta.textContent = module.kind.toUpperCase() + ' · ' + module.fileCount.toLocaleString() + ' files · ' + module.testFileCount + ' tests';
          group.appendChild(meta);
          group.addEventListener('click', function selectByClick() { selectModule(module.id); });
          group.addEventListener('keydown', function selectByKeyboard(event) {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectModule(module.id); }
          });
          svg.appendChild(group);
          nodeElements.set(module.id, group);
        });
      }

      // ====================================================================
      // Selection, Search, And Flow Highlighting
      // ====================================================================
      // Node selection emphasizes direct callers/dependencies. A flow selection instead
      // emphasizes the ordered transaction and explains every step in the detail panel.
      // ====================================================================
      function selectModule(moduleId, updateHash) {
        state.selectedModuleId = moduleId;
        state.selectedFlowId = null;
        updateFlowButtons();
        updateVisualState();
        renderModuleDetails(moduleById.get(moduleId));
        if (updateHash !== false) history.replaceState(null, '', '#module=' + encodeURIComponent(moduleId));
      }

      function selectFlow(flowId) {
        state.selectedFlowId = state.selectedFlowId === flowId ? null : flowId;
        state.selectedModuleId = null;
        updateFlowButtons();
        updateVisualState();
        if (state.selectedFlowId) {
          const selectedFlow = data.flows.find(function findFlow(flow) { return flow.id === state.selectedFlowId; });
          renderFlowDetails(selectedFlow);
          history.replaceState(null, '', '#flow=' + encodeURIComponent(flowId));
        } else {
          renderOverview();
          history.replaceState(null, '', location.pathname + location.search);
        }
      }

      function updateVisualState() {
        const related = new Set();
        const activeEdges = new Set();
        if (state.selectedModuleId) {
          related.add(state.selectedModuleId);
          data.relationships.forEach(function collectNeighbors(edge) {
            if (edge.source === state.selectedModuleId || edge.target === state.selectedModuleId) {
              related.add(edge.source); related.add(edge.target); activeEdges.add(edge.id);
            }
          });
        }
        if (state.selectedFlowId) {
          const selectedFlow = data.flows.find(function findFlow(flow) { return flow.id === state.selectedFlowId; });
          selectedFlow.steps.forEach(function collectStep(step) { related.add(step.moduleId); });
          for (let index = 0; index < selectedFlow.steps.length - 1; index += 1) {
            const source = selectedFlow.steps[index].moduleId;
            const target = selectedFlow.steps[index + 1].moduleId;
            data.relationships.filter(function matchFlowEdge(edge) { return edge.source === source && edge.target === target; })
              .forEach(function collectFlowEdge(edge) { activeEdges.add(edge.id); });
          }
        }

        nodeElements.forEach(function styleNode(element, moduleId) {
          element.classList.toggle('selected', moduleId === state.selectedModuleId);
          element.classList.toggle('related', related.has(moduleId) && moduleId !== state.selectedModuleId);
          element.classList.toggle('dimmed', related.size > 0 && !related.has(moduleId));
          const module = moduleById.get(moduleId);
          const haystack = [module.name, module.role, module.scopes.join(' '), module.files.join(' ')].join(' ').toLowerCase();
          element.classList.toggle('search-hit', Boolean(state.search) && haystack.includes(state.search));
        });
        edgeElements.forEach(function styleEdge(element, edgeId) {
          element.classList.toggle('active', activeEdges.has(edgeId));
          element.classList.toggle('dimmed', activeEdges.size > 0 && !activeEdges.has(edgeId));
          if (state.selectedFlowId) {
            const selectedFlow = data.flows.find(function findFlow(flow) { return flow.id === state.selectedFlowId; });
            element.style.setProperty('--edge-color', selectedFlow.color);
          } else {
            element.style.removeProperty('--edge-color');
          }
        });
      }

      // Search keeps the complete lower-level inventory discoverable without adding file
      // nodes. Pressing Enter opens the first matching module and preserves its file filter.
      searchInput.addEventListener('input', function searchChanged() {
        state.search = searchInput.value.trim().toLowerCase();
        updateVisualState();
      });
      searchInput.addEventListener('keydown', function openFirstSearchResult(event) {
        if (event.key !== 'Enter' || !state.search) return;
        const match = data.modules.find(function matchesModule(module) {
          return [module.name, module.role, module.scopes.join(' '), module.files.join(' ')].join(' ').toLowerCase().includes(state.search);
        });
        if (match) selectModule(match.id);
      });

      document.getElementById('reset').addEventListener('click', function resetMap() {
        state.selectedModuleId = null; state.selectedFlowId = null; state.search = ''; searchInput.value = '';
        updateFlowButtons(); updateVisualState(); renderOverview();
        history.replaceState(null, '', location.pathname + location.search);
      });

      // ====================================================================
      // Evidence Panel
      // ====================================================================
      // All paths become relative links back to the checkout root. The complete file list is
      // searchable and capped per render to keep a large module responsive.
      // ====================================================================
      function renderOverview() {
        details.innerHTML = '';
        details.appendChild(eyebrow('Verified snapshot'));
        details.appendChild(heading(2, 'How to read this map'));
        details.appendChild(paragraph('The first screen is deliberately limited to ' + data.display.primaryNodeCount + ' primary nodes. Every one of the ' + data.scope.totalFiles.toLocaleString() + ' scanned files is nested under exactly one module; current imports are aggregated between modules.'));
        details.appendChild(callout('Select a module to inspect its role, upstream callers, dependencies, downstream impact, source evidence, related tests, and complete lower-level file membership.', '#7dd3fc'));
        details.appendChild(heading(3, 'Five end-to-end flows'));
        const list = document.createElement('ul'); list.className = 'relation-list';
        data.flows.forEach(function addFlow(flow) {
          const item = document.createElement('li'); const button = document.createElement('button');
          button.type = 'button'; button.textContent = flow.name; button.addEventListener('click', function chooseFlow() { selectFlow(flow.id); });
          item.appendChild(button); list.appendChild(item);
        });
        details.appendChild(list);
        details.appendChild(heading(3, 'Scope boundary'));
        details.appendChild(paragraph(data.scope.note));
        details.appendChild(pathList([data.scope.ignoreFile, data.verificationContract.sourceInventory]));
      }

      function renderModuleDetails(module) {
        details.innerHTML = '';
        details.style.setProperty('--accent', module.color);
        details.appendChild(eyebrow(module.layer + ' · ' + module.kind));
        details.appendChild(heading(2, module.name));
        details.appendChild(paragraph(module.role));
        const badges = document.createElement('div'); badges.className = 'badge-row';
        [module.fileCount.toLocaleString() + ' owned files', module.testFileCount + ' nested test files', module.evidence.length + ' source evidence paths', module.tests.length + ' highlighted tests'].forEach(function addBadge(text) {
          const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = text; badges.appendChild(badge);
        });
        details.appendChild(badges);
        details.appendChild(callout(module.impact, module.color));
        details.appendChild(heading(3, 'Owned scope'));
        details.appendChild(paragraph(module.scopes.join(' · ')));
        appendRelations(module.id, 'Upstream callers', true);
        appendRelations(module.id, 'Dependencies', false);
        details.appendChild(heading(3, 'Source evidence'));
        details.appendChild(pathList(module.evidence));
        details.appendChild(heading(3, 'Related tests'));
        details.appendChild(pathList(module.tests));
        if (module.dependencies.length) {
          details.appendChild(heading(3, 'External boundary'));
          const list = document.createElement('ul'); list.className = 'evidence-list';
          module.dependencies.forEach(function addDependency(name) { const item = document.createElement('li'); item.textContent = name; list.appendChild(item); });
          details.appendChild(list);
        }
        details.appendChild(heading(3, 'Lower-level files'));
        appendFileBrowser(module);
      }

      function appendRelations(moduleId, title, incoming) {
        const semantic = data.relationships.filter(function belongs(edge) { return incoming ? edge.target === moduleId : edge.source === moduleId; });
        const aggregate = data.aggregatedImports.filter(function belongs(edge) { return incoming ? edge.target === moduleId : edge.source === moduleId; });
        details.appendChild(heading(3, title));
        const list = document.createElement('ul'); list.className = 'relation-list';
        semantic.forEach(function addRelation(edge) {
          const peerId = incoming ? edge.source : edge.target;
          const peer = moduleById.get(peerId);
          const item = document.createElement('li'); const button = document.createElement('button'); button.type = 'button';
          const strong = document.createElement('strong'); strong.textContent = peer.name + ' — ' + edge.label;
          const small = document.createElement('small'); small.textContent = edge.summary + (edge.importCount ? ' (' + edge.importCount + ' current structural imports)' : '');
          button.append(strong, small); button.addEventListener('click', function followRelation() { selectModule(peerId); }); item.appendChild(button); list.appendChild(item);
        });
        if (!semantic.length) { const item = document.createElement('li'); item.className = 'empty'; item.textContent = 'No selected runtime relationship in this direction.'; list.appendChild(item); }
        const structuralOnly = aggregate.filter(function notAlreadyExplained(edge) {
          return !semantic.some(function samePeer(item) { return incoming ? item.source === edge.source : item.target === edge.target; });
        }).slice(0, 8);
        structuralOnly.forEach(function addStructural(edge) {
          const peerId = incoming ? edge.source : edge.target; const peer = moduleById.get(peerId);
          const item = document.createElement('li'); const button = document.createElement('button'); button.type = 'button';
          button.textContent = peer.name + ' — ' + edge.count + ' current structural imports';
          button.addEventListener('click', function followStructural() { selectModule(peerId); }); item.appendChild(button); list.appendChild(item);
        });
        details.appendChild(list);
      }

      function appendFileBrowser(module) {
        const tools = document.createElement('div'); tools.className = 'file-tools';
        const input = document.createElement('input'); input.type = 'search'; input.placeholder = 'Filter ' + module.fileCount.toLocaleString() + ' owned paths…'; input.setAttribute('aria-label', 'Filter owned file paths');
        tools.appendChild(input); details.appendChild(tools);
        const list = document.createElement('ul'); list.className = 'file-list'; details.appendChild(list);
        function renderFiles() {
          const query = input.value.trim().toLowerCase();
          const matching = module.files.filter(function matches(path) { return !query || path.toLowerCase().includes(query); });
          list.innerHTML = '';
          matching.slice(0, 240).forEach(function addFile(path) { const item = document.createElement('li'); item.appendChild(pathLink(path)); list.appendChild(item); });
          if (matching.length > 240) { const item = document.createElement('li'); item.className = 'empty'; item.textContent = (matching.length - 240).toLocaleString() + ' more paths — refine the filter to inspect them.'; list.appendChild(item); }
          if (!matching.length) { const item = document.createElement('li'); item.className = 'empty'; item.textContent = 'No owned paths match this filter.'; list.appendChild(item); }
        }
        input.addEventListener('input', renderFiles); renderFiles();
      }

      function renderFlowDetails(flow) {
        details.innerHTML = '';
        details.style.setProperty('--accent', flow.color);
        details.style.setProperty('--flow-color', flow.color);
        details.appendChild(eyebrow('End-to-end flow'));
        details.appendChild(heading(2, flow.name));
        details.appendChild(paragraph('Each step names the owning primary module and links to the exact source evidence behind the transition.'));
        const list = document.createElement('ol'); list.className = 'flow-steps';
        flow.steps.forEach(function addStep(step) {
          const module = moduleById.get(step.moduleId); const item = document.createElement('li');
          const button = document.createElement('button'); button.type = 'button'; button.className = 'ghost-button'; button.textContent = module.name; button.addEventListener('click', function openModule() { selectModule(module.id); });
          const summary = paragraph(step.summary); const evidence = pathList(step.evidence);
          item.append(button, summary, evidence); list.appendChild(item);
        });
        details.appendChild(list);
      }

      // ====================================================================
      // DOM And SVG Helpers
      // ====================================================================
      // Small constructors keep all dynamic text on textContent, preventing file paths or
      // descriptions from becoming executable markup inside the standalone artifact.
      // ====================================================================
      function svgElement(name, attributes) {
        const element = document.createElementNS('http://www.w3.org/2000/svg', name);
        Object.entries(attributes || {}).forEach(function setAttribute(entry) { element.setAttribute(entry[0], entry[1]); });
        return element;
      }

      function curveBetween(source, target) {
        const width = data.display.nodeSize[0]; const height = data.display.nodeSize[1];
        const sx = source.x + width / 2; const sy = source.y + height / 2;
        const tx = target.x + width / 2; const ty = target.y + height / 2;
        const dx = tx - sx; const dy = ty - sy; const bend = Math.max(35, Math.min(150, Math.abs(dx) * .28 + Math.abs(dy) * .12));
        if (Math.abs(dx) > Math.abs(dy)) {
          const direction = Math.sign(dx) || 1;
          return 'M ' + (sx + direction * width / 2) + ' ' + sy + ' C ' + (sx + direction * (width / 2 + bend)) + ' ' + sy + ', ' + (tx - direction * (width / 2 + bend)) + ' ' + ty + ', ' + (tx - direction * width / 2) + ' ' + ty;
        }
        const direction = Math.sign(dy) || 1;
        return 'M ' + sx + ' ' + (sy + direction * height / 2) + ' C ' + sx + ' ' + (sy + direction * (height / 2 + bend)) + ', ' + tx + ' ' + (ty - direction * (height / 2 + bend)) + ', ' + tx + ' ' + (ty - direction * height / 2);
      }

      function appendWrappedTitle(group, title) {
        const words = title.split(' '); const lines = [''];
        words.forEach(function wrap(word) {
          const current = lines[lines.length - 1];
          if ((current + ' ' + word).trim().length > 24 && lines.length < 2) lines.push(word);
          else lines[lines.length - 1] = (current + ' ' + word).trim();
        });
        lines.forEach(function addLine(line, index) { const text = svgElement('text', { x:16, y:27 + index * 17, class:'node-title' }); text.textContent = line; group.appendChild(text); });
      }

      function isDataEdge(edge) { return ['reads_from','writes_to','publishes','validates'].includes(edge.kind); }
      function isFlowTransition(edge) {
        return data.flows.some(function flowContainsEdge(flow) {
          return flow.steps.some(function stepMatches(currentStep, index) {
            const nextStep = flow.steps[index + 1];
            return nextStep && currentStep.moduleId === edge.source && nextStep.moduleId === edge.target;
          });
        });
      }
      function heading(level, text) { const element = document.createElement('h' + level); element.textContent = text; return element; }
      function paragraph(text) { const element = document.createElement('p'); element.textContent = text; return element; }
      function eyebrow(text) { const element = document.createElement('div'); element.className = 'eyebrow'; element.textContent = text; return element; }
      function callout(text, color) { const element = document.createElement('p'); element.className = 'callout'; element.style.setProperty('--accent', color); element.textContent = text; return element; }
      function pathLink(path) { const link = document.createElement('a'); link.href = '../../' + path.split('/').map(encodeURIComponent).join('/'); link.textContent = path; return link; }
      function pathList(paths) { const list = document.createElement('ul'); list.className = 'evidence-list'; paths.forEach(function addPath(path) { const item = document.createElement('li'); item.appendChild(pathLink(path)); list.appendChild(item); }); return list; }

      function buildFlowButtons() {
        const strip = document.getElementById('flow-strip');
        data.flows.forEach(function addFlowButton(flow) {
          const button = document.createElement('button'); button.type = 'button'; button.className = 'flow-button'; button.dataset.flowId = flow.id; button.style.setProperty('--flow-color', flow.color); button.textContent = flow.name.replace(/^d+.s*/, '');
          button.addEventListener('click', function chooseFlow() { selectFlow(flow.id); }); strip.appendChild(button);
        });
      }

      function updateFlowButtons() {
        document.querySelectorAll('.flow-button').forEach(function styleButton(button) { button.classList.toggle('active', button.dataset.flowId === state.selectedFlowId); });
      }

      function restoreHashSelection() {
        const hash = location.hash.slice(1); const pieces = hash.split('=');
        if (pieces[0] === 'module' && moduleById.has(decodeURIComponent(pieces[1] || ''))) selectModule(decodeURIComponent(pieces[1]), false);
        else if (pieces[0] === 'flow' && data.flows.some(function hasFlow(flow) { return flow.id === decodeURIComponent(pieces[1] || ''); })) selectFlow(decodeURIComponent(pieces[1]));
        else renderOverview();
      }

      renderGraph(); buildFlowButtons(); restoreHashSelection(); updateVisualState();
    }());
  </script>
</body>
</html>
