<!doctype html>
<!-- Human requests read from the shared Agora board; no approvals are inferred here. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pending Decisions | Agora</title>
  <style>
    :root { color-scheme: dark; --bg:#0e1117; --surface:#161b22; --border:#3a4456; --text:#e6edf3; --dim:#9aa7b4; --accent:#58a6ff; --amber:#e3a008; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 system-ui, sans-serif; }
    a { color:var(--accent); overflow-wrap:anywhere; }
    button, input, select { font:inherit; color:inherit; }
    button, select, input { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:8px 12px; }
    button, select { cursor:pointer; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    header { border-bottom:3px solid var(--border); padding:16px 24px; display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
    .brand { font-size:20px; font-weight:700; text-decoration:none; color:var(--text); }
    nav { display:flex; gap:16px; flex-wrap:wrap; }
    nav a { text-decoration:none; }
    nav a[aria-current] { color:var(--text); border-bottom:2px solid var(--accent); }
    main { max-width:1500px; margin:auto; padding:24px; }
    .heading { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
    h1 { font-size:24px; margin:0; }
    h2 { font-size:20px; margin:0 0 12px; overflow-wrap:anywhere; }
    h3 { font-size:14px; margin:0 0 8px; }
    .dim, .meta { color:var(--dim); }
    .meta { font-size:12px; }
    #status { margin:10px 0 16px; }
    #status[data-error] { color:#ff8e87; }
    .toolbar { display:flex; gap:12px; align-items:end; flex-wrap:wrap; padding-bottom:20px; border-bottom:1px solid var(--border); }
    .modes { display:flex; gap:4px; }
    .modes button[aria-pressed="true"] { border-color:var(--accent); background:#1b2c3e; }
    label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--dim); }
    #search { width:300px; max-width:100%; }
    .workspace { display:grid; grid-template-columns:minmax(280px,420px) minmax(0,1fr); gap:28px; margin-top:20px; align-items:start; }
    #request-list { display:flex; flex-direction:column; gap:8px; max-height:calc(100dvh - 270px); overflow-y:auto; padding:3px; }
    .request { width:100%; text-align:left; padding:14px; border-radius:6px; }
    .request[aria-pressed="true"] { border:2px solid var(--accent); padding:13px; background:#17263a; }
    .request strong { display:block; overflow-wrap:anywhere; margin-bottom:8px; }
    .request .meta { display:block; }
    .stale { color:var(--amber); }
    .detail { border-left:3px solid var(--border); padding-left:24px; min-width:0; }
    .detail section, details { margin-top:24px; }
    .prose { white-space:pre-wrap; overflow-wrap:anywhere; }
    .reason { border-left:3px solid var(--amber); padding:12px 16px; background:var(--surface); }
    .facts { display:flex; gap:12px 24px; flex-wrap:wrap; margin:0 0 20px; }
    .facts div { min-width:100px; max-width:100%; }
    dt { color:var(--dim); font-size:12px; }
    dd { margin:0; overflow-wrap:anywhere; }
    ul { padding-left:20px; }
    li { margin:8px 0; overflow-wrap:anywhere; }
    summary { cursor:pointer; color:var(--accent); }
    .empty { padding:24px 0; color:var(--dim); }
    .sources { display:flex; flex-direction:column; align-items:start; gap:8px; }
    @media(max-width:760px) {
      header, main { padding:16px; }
      .workspace { grid-template-columns:minmax(0,1fr); }
      #request-list { max-height:320px; }
      .detail { padding:20px 0 0; border-left:0; border-top:3px solid var(--border); }
      label, #search { width:100%; }
      .toolbar { align-items:stretch; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Agora</a>
    <nav aria-label="Dashboard views"><a href="/">Board</a><a href="/dashboard/decisions.html" aria-current="page">Decisions</a><a href="/dashboard/wildkin.html">Wildkin</a><a href="/?view=pets">Pets</a></nav>
  </header>
  <main>
    <div class="heading"><h1>Pending decisions</h1><span class="dim" id="total">Loading requests...</span></div>
    <p id="status" role="status">Reading the live board...</p>
    <div class="toolbar">
      <div class="modes" aria-label="Request type">
        <button type="button" data-kind="decision" aria-pressed="true">Decisions <span id="decision-count">0</span></button>
        <button type="button" data-kind="action" aria-pressed="false">Hands-on requests <span id="action-count">0</span></button>
      </div>
      <label>Campaign<select id="campaign"><option value="all">All campaigns</option></select></label>
      <label>Search<input type="search" id="search" placeholder="Find a question or task"></label>
      <button type="button" id="refresh" title="Refresh requests" aria-label="Refresh requests">&#8635;</button>
    </div>
    <div class="workspace">
      <div id="request-list" aria-label="Pending requests"></div>
      <article class="detail" id="detail" aria-label="Request details"><p class="empty">Loading...</p></article>
    </div>
  </main>
  <script type="module" src="/dashboard/decisions.mjs"></script>
</body>
</html>
